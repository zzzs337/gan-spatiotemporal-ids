data:
  dataset: null
  train_path: null
  test_path: null
  test_size: 0.4
  validation_size: 0.2
  label_column: label
  categorical_columns: []
  csv_options: {}
  processed_dir: data/processed/default
  window_size: 4
  window_stride: 1

model:
  hidden_dim: 64
  num_blocks: 3
  kernel_sizes: [3, 5, 7]
