gan:
  enabled: true
  noise_dim: 32
  hidden_dim: 64
  batch_size: 128
  epochs: 20
  learning_rate: 0.0002
  target_samples: null
  minimum_real_samples: 8

training:
  batch_size: 128
  epochs: 11
  learning_rate: 0.001

experiment:
  seed: 42
  output_dir: outputs/default
